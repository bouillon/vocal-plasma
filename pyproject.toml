[project]
name = "kokoro-tts"
version = "0.1.3"
description = "Text-to-Speech using Kokoro ONNX model"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro-onnx>=0.4.9",
    "piper-tts>=1.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]

[project.scripts]
speak = "kokoro_tts.cli:main"

[tool.setuptools]
packages = ["kokoro_tts"]
